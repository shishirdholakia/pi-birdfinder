units:
  zero:
    host: zero
    user: shishir
    transport: ssh
    pps_names: ["PPS", "PPS0", "GPS0", "SHM1"]

  one:
    host: one
    user: shishir
    transport: ssh
    pps_names: ["PPS", "PPS0", "GPS0", "SHM1"]

  four:
    host: four
    user: shishir
    transport: ssh
    pps_names: ["PPS", "PPS0", "GPS0", "SHM1"]

  five:
    host: localhost
    user: shishir
    transport: local
    pps_names: ["PPS", "PPS0", "GPS0", "SHM1"]

polling:
  interval_s: 5
  command_timeout_s: 8

location:
  min_fixes_for_good: 50
  max_eph_m: 50
  weight_floor_m: 2.0

clips:
  output_root: data/event_clips

# Pipeline/dashboard integration. The dashboard expects the ARU pipeline scripts
# from aru_pipeline_scripts_with_acquire.zip to be copied into this directory.
pipeline:
  script_dir: aru_pipeline
  python: .venv/bin/python
  acquire_script: acquire.py
  calibrate_script: aru_calibrate_session.py
  localize_script: aru_localize_event.py
  default_units: [zero, one, four, five]
  finalize_wait_s: 10

jobs:
  root: data/jobs

calibrations:
  root: data/calibrations
  active_file: data/calibrations/active_session_calibration.txt

localizations:
  root: data/localizations

location_overrides:
  root: data/location_overrides
  active_file: data/location_overrides/active_location_override.txt
